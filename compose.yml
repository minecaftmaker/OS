services:
  macos:
    image: ghcr.io/dockur/macos:latest
    container_name: macos
    environment:
      VERSION: "26"
      RAM_SIZE: "6G"
      CPU_CORES: "2"
      DISK_SIZE: "24G"
      DISK_FMT: "qcow2"
      DISK_CACHE: "none"
      DISK_TYPE: "blk"
      RAM_MINIMUM: "4G"
      DISK_MINIMUM: "12G"
      # Keep optional services off unless explicitly enabled.
      AUDIO: "N"
      DHCP: "N"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./macos:/storage
    restart: on-failure
    stop_grace_period: 2m
