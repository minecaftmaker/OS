services:
  macos:
    container_name: macos
    image: ghcr.io/dockur/macos:latest
    environment:
      VERSION: "26"
      # Installation profile: keep the host overhead low while still giving
      # Tahoe enough memory to complete recovery/install reliably.
      RAM_SIZE: "4G"
      CPU_CORES: "1"
      # Tahoe checks the logical guest capacity. qcow2 keeps this sparse.
      DISK_SIZE: "44G"
      DISK_FMT: "qcow2"
      DISK_CACHE: "none"
      DISK_TYPE: "blk"
      RAM_MINIMUM: "3G"
      DISK_MINIMUM: "12G"
      AUDIO: "N"
      DHCP: "N"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
    volumes:
      - ../macos:/storage
    restart: "no"
    stop_grace_period: 30s
