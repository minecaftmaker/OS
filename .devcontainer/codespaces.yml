services:
  macos:
    container_name: macos
    image: ghcr.io/dockur/macos:latest
    environment:
      VERSION: "26"
      RAM_SIZE: "6G"
      CPU_CORES: "2"
      # Tahoe's installer checks the virtual disk capacity, not the amount
      # currently allocated on the host. Keep this sparse so Codespaces does
      # not immediately consume the whole filesystem.
      DISK_SIZE: "44G"
      DISK_FMT: "qcow2"
      DISK_CACHE: "none"
      DISK_TYPE: "blk"
      RAM_MINIMUM: "4G"
      DISK_MINIMUM: "12G"
      AUDIO: "N"
      DHCP: "N"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ../macos:/storage
    restart: on-failure
    stop_grace_period: 2m
